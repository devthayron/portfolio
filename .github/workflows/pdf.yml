name: Gerar PDF do currículo

on:
  push:
    branches: [main, master]
    paths:
      - "curriculo.html"
      - "css/curriculo.css"
      - "scripts/gerar_curriculo.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Gerar PDF
        run: python scripts/gerar_curriculo.py

      - name: Commitar o PDF, se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/curriculo-thayron.pdf
          if git diff --staged --quiet; then
            echo "PDF sem mudanças."
          else
            git commit -m "chore: atualiza PDF do currículo"
            git push
          fi
